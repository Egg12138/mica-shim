[Mica]
OS=zephyr
# Ignored
Name=qemu-zephyr
# Ignored
Memory=...
CPU="1,3-5"
CAP=
VCPU

ClientPath=zephyr.elf
Pedestal=baremetal
PedestalConf=trest=1
# Ignored
AutoBoot=no


# Update related stuff
# CPU => CPU Affinity
# once cap > affinity, micran modify CPU
CPU, # <=> bound set (recommended:  default to be `all` )
CPUCapacity, # <=> cp u_max (percentage)
Weight, # only core race case
MaxMemory, # <=> memory limit
Memory(MB u32), # <=> required memory
VCPU  # <=> cpu number in OS's view ; vcpu_num
# TODO: MAX VCPU ??
# if vcpu_num < maxvcpus : 
# vcpu_num is online, remainder will be created offline


# the minimal expansion
# CPU.
CPUCapacity=200 # from 175% to 200%; 
Memory=512  # from 128 to 512 MB

# the minimal shrinking
CPUCapacity=70 # from 172% to 70%



